appId: com.areebhirani.daycare-watch
---
- openLink: daycarewatch://daycare/1459611
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Watch this daycare|Watching.*"
    timeout: 20000
- takeScreenshot: e2e/out/watch-0-record
- tapOn: "Watch this daycare"
- extendedWaitUntil:
    visible: "Turn on alerts"
    timeout: 10000
- takeScreenshot: e2e/out/watch-1-explain
- tapOn: "Turn on alerts"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "You’re watching.*"
    timeout: 15000
- takeScreenshot: e2e/out/watch-2-confirmed
