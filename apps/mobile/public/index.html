<!doctype html>
<!--
  Page shell for the web build (web.output "single" reads this file; src/app/+html.tsx is only used by
  static output). Keep the page CSS below in step with +html.tsx.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="What Texas state inspectors found at a daycare, in plain English. Checked against the state every day." />
    <title>%WEB_TITLE%</title>
    <!-- The card a shared link shows (iMessage, Slack, social): absolute URLs, as the crawlers require. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daycare Watch" />
    <meta property="og:title" content="Daycare Watch" />
    <meta property="og:description" content="What Texas inspectors found at your kid’s daycare, in plain English. Real state records from data.texas.gov, checked against the state every day." />
    <meta property="og:url" content="https://daycare-watch.vercel.app/" />
    <meta property="og:image" content="https://daycare-watch.vercel.app/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daycare Watch on an iPhone, showing a Frisco daycare's state record in plain words." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Under 768 px the app is a phone column; from 768 up it draws an iPhone frame with the live app inside
         (src/components/web/PhoneStage.web.tsx, DESIGN.md §11), so #root fills the window. -->
    <style id="page">
      body { background: #F2F2F5; }
      #root { min-height: 100dvh; }
      /* Keyboard focus: a 2 pt ring in the text colour, 2 pt outside (DESIGN.md §11). */
      :focus-visible { outline: 2px solid #0B0B0C; outline-offset: 2px; }
      @media (max-width: 767px) {
        #root { max-width: 480px; margin: 0 auto; background: #FFFFFF; }
      }
      @media (prefers-color-scheme: dark) {
        body { background: #000000; }
        #root { background: #000000; }
        :focus-visible { outline-color: #F5F5F7; }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
