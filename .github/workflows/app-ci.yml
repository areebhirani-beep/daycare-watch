name: app-ci

on:
  push:
    paths: ["apps/mobile/**", "packages/**", "package.json", "package-lock.json", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/**", "package.json", "package-lock.json"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Every workspace: the app and packages/db.
      - run: npm run typecheck
      - run: npm run -s lint
        working-directory: apps/mobile
      - run: npx jest --ci
        working-directory: apps/mobile
