# QA u29: place page, a home, and search under the largest accessibility text size (run.sh sets it with simctl).
appId: host.exp.Exponent
---
- stopApp
- runFlow: _open.yaml
- openLink: ${METRO}/--/daycare/1459611
- extendedWaitUntil:
    visible: "Viva World School.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/qa/u29-xxxl-0-place
- scroll
- takeScreenshot: e2e/out/qa/u29-xxxl-1-place-scrolled
- openLink: ${METRO}/--/daycare/1490119
- extendedWaitUntil:
    visible: ".*Baker.*"
    timeout: 20000
- takeScreenshot: e2e/out/qa/u29-xxxl-2-home
- openLink: ${METRO}/--/search
- waitForAnimationToEnd
- takeScreenshot: e2e/out/qa/u29-xxxl-3-search
