# QA U18: watch, unwatch, re-watch on one real record (97587 Amarillo Wesley Community Center).
# Watch opens the sheet ("Turn on alerts" → "You’re watching" → "Done"); the place button then reads
# "Watching · alerts on|off". Tapping it opens the sheet, where "Stop watching" unwatches.
appId: host.exp.Exponent
---
- runFlow: _open.yaml
- openLink: ${METRO}/--/daycare/97587
- extendedWaitUntil:
    visible: "Amarillo Wesley.*"
    timeout: 20000
# Start from not watching.
- runFlow:
    when:
      visible: "Watching ·.*"
    commands:
      - tapOn: "Watching ·.*"
      - tapOn: "Stop watching"
      - extendedWaitUntil:
          visible: "Watch this daycare"
          timeout: 10000

# Watch
- tapOn: "Watch this daycare"
- extendedWaitUntil:
    visible: "Turn on alerts"
    timeout: 10000
- takeScreenshot: ../../harness/state/qa/u18-0-sheet
- tapOn: "Turn on alerts"
# U19: the iOS permission prompt appears the first time; allow it.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - takeScreenshot: ../../harness/state/qa/u19-0-os-prompt
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "You’re watching.*"
    timeout: 15000
- takeScreenshot: ../../harness/state/qa/u18-1-watching
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Watching ·.*"
    timeout: 10000
- takeScreenshot: ../../harness/state/qa/u18-2-place-watching

# Unwatch: the place button opens the watch sheet; "Stop watching" is the deliberate second tap (D10).
- tapOn: "Watching ·.*"
- extendedWaitUntil:
    visible: "Stop watching"
    timeout: 10000
- takeScreenshot: ../../harness/state/qa/u18-2b-stop-sheet
- tapOn: "Stop watching"
- extendedWaitUntil:
    visible: "Watch this daycare"
    timeout: 10000
- takeScreenshot: ../../harness/state/qa/u18-3-unwatched

# Re-watch
- tapOn: "Watch this daycare"
- extendedWaitUntil:
    visible: "Turn on alerts"
    timeout: 10000
- tapOn: "Turn on alerts"
- extendedWaitUntil:
    visible: "You’re watching.*"
    timeout: 15000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Watching ·.*"
    timeout: 10000
- takeScreenshot: ../../harness/state/qa/u18-4-rewatched
