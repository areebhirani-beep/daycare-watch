appId: com.areebhirani.daycare-watch
# Find a real daycare by name, open its record, and watch it.
# Run through e2e/journey.sh, which then delivers the replayed alert and runs alert-tap.yaml.
---
- launchApp
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
# The app can come back on another tab (a previous run, a push tap); start from Find.
- runFlow:
    when:
      visible: "Find"
    commands:
      - tapOn: "Find"
# Home is the map with a bottom sheet; the search pill opens the search screen.
- extendedWaitUntil:
    visible: "Search daycares, cities, ZIP"
    timeout: 30000
- tapOn: "Search daycares, cities, ZIP"
- extendedWaitUntil:
    visible: "Search daycares, cities, ZIP"
    timeout: 10000
- inputText: "Viva World School"
# The result row's label is "<name>. <type> · <city>. <record>"; matching it skips the text field.
- extendedWaitUntil:
    visible: "Viva World School\\. .*"
    timeout: 15000
- hideKeyboard
- takeScreenshot: e2e/out/journey-0-search
- tapOn: "Viva World School\\. .*"
- extendedWaitUntil:
    visible: "State record"
    timeout: 20000
- takeScreenshot: e2e/out/journey-1-record
# A device that already watches this daycare shows "Watching"; otherwise walk the watch flow.
- runFlow:
    when:
      visible: "Watch this daycare"
    commands:
      - tapOn: "Watch this daycare"
      - extendedWaitUntil:
          visible: "Turn on alerts"
          timeout: 10000
      - tapOn: "Turn on alerts"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - extendedWaitUntil:
          visible: "You’re watching.*"
          timeout: 15000
- takeScreenshot: e2e/out/journey-2-watching
- pressKey: Home
