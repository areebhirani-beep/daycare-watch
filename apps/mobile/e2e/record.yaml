appId: com.areebhirani.daycare-watch
---
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- extendedWaitUntil:
    visible: "Watch this daycare|Watching.*"
    timeout: 20000
- takeScreenshot: e2e/out/record-1
- scroll
- takeScreenshot: e2e/out/record-2
- scroll
- takeScreenshot: e2e/out/record-3
- scrollUntilVisible:
    element: "Last checked with the state.*"
    direction: DOWN
- takeScreenshot: e2e/out/record-4
