name: pipeline-ci

on:
  push:
    paths: ["services/pipeline/**", ".github/workflows/pipeline-ci.yml"]
  pull_request:
    paths: ["services/pipeline/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy --strict src
      # Database tests skip without DATABASE_URL; they run locally against the Supabase stack.
      - run: uv run --no-sync pytest -q --cov=pipeline.load --cov=pipeline.classify --cov-report=term
