appId: com.areebhirani.daycare-watch
---
- stopApp
- openLink: exp+daycare-watch://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_onboarding=1&__expo_disable_fab=1
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Find a daycare"
    timeout: 90000
- extendedWaitUntil:
    visible: "NEAREST FIRST"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-find
- tapOn: "Name, city, or ZIP"
- inputText: "Rockwall"
- extendedWaitUntil:
    visible: ".*MATCH.*"
    timeout: 10000
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-search
- tapOn: "Watching"
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-watching
- tapOn: "Your rights"
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-rights
- openLink: daycarewatch://daycare/1459611
- extendedWaitUntil:
    visible: "Watch this daycare|Watching.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-record-1
- scroll
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-record-2
- openLink: daycarewatch://daycare/1459611/tour
- extendedWaitUntil:
    visible: "Share these questions"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-tour
- openLink: daycarewatch://report
- extendedWaitUntil:
    visible: "Texas Abuse Hotline.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-report
- openLink: daycarewatch://alert/45
- extendedWaitUntil:
    visible: "Open full record"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/${MODE}-alert
