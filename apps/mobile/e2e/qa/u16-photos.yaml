# QA U16: street photos are collected but NOT shown for the submission (lib/mapillary.ts SHOW_STREET_PHOTOS =
# false). On centers that do have photo rows (1396589 has 3, 136712 has 2), every gallery page is swiped
# through and no street photo or Mapillary credit may appear. Homes and approximate points keep their own rules.
appId: host.exp.Exponent
---
- runFlow: _open.yaml
- openLink: ${METRO}/--/daycare/1396589
- extendedWaitUntil:
    visible: "3D view · Apple Maps"
    timeout: 20000
- repeat:
    times: 4
    commands:
      - assertNotVisible: ".*Mapillary.*"
      - assertNotVisible: "Street view near the address"
      - swipe:
          start: 80%, 18%
          end: 15%, 18%
- takeScreenshot: e2e/out/qa/u16-off-1396589
- openLink: ${METRO}/--/daycare/136712
- extendedWaitUntil:
    visible: "3D view · Apple Maps"
    timeout: 20000
- repeat:
    times: 4
    commands:
      - assertNotVisible: ".*Mapillary.*"
      - assertNotVisible: "Street view near the address"
      - swipe:
          start: 80%, 18%
          end: 15%, 18%
# approximate: no 3D, no photos
- openLink: ${METRO}/--/daycare/98685
- extendedWaitUntil:
    visible: "Play House.*"
    timeout: 20000
- assertVisible: "Approximate location"
- assertNotVisible: ".*Mapillary.*"
# home: neighborhood only
- openLink: ${METRO}/--/daycare/1462404
- extendedWaitUntil:
    visible: "Neighborhood only · private home"
    timeout: 20000
- assertNotVisible: ".*Mapillary.*"
- assertNotVisible: "3D view · Apple Maps"
- takeScreenshot: e2e/out/qa/u16b-home
