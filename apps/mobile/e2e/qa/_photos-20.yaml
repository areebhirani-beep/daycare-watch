# Photos QA: 20 TX-04 licensed centers with an exact census geocode (random by md5 of the id, 4 Montessoris),
# plus 1509829, the one center with 2 checked street photos.
# For each, open the place page and capture every carousel page, so a person can check each label is true:
# "this daycare" only on a verified photo or a same-name Look Around, "The street at this address" otherwise.
# Run through e2e/qa/photos.sh on the Release build. Screens: ${SHOTS}/<id>-<page>.
appId: com.areebhirani.daycare-watch
---
- launchApp
# YMCA @ Norris Elementary, FRISCO
- openLink: daycarewatch://daycare/1194568
# iOS asks before an app opens its own link from outside.
- runFlow:
    when:
      visible: "Open in .Daycare Watch.\\?"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible: "Watch this daycare|Watching.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/1194568-1
- swipe:
    start: 85%, 15%
    end: 10%, 15%
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/1194568-2
- swipe:
    start: 85%, 15%
    end: 10%, 15%
- waitForAnimationToEnd
- takeScreenshot: ${SHOTS}/1194568-3
