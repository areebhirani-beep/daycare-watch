name: daily-sync

# The state reloads activities and violations nightly around 09:00 UTC; run after it settles.
on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "sync (daily), backfill (first load of a new database), or photos (Mapillary street photos only)"
        type: choice
        options: [sync, backfill, photos]
        default: sync
      full:
        description: "sync only: re-pull every operation, not only those past the watermark"
        type: boolean
        default: false
      dry_run:
        description: "sync and photos: do everything, then write nothing; no pushes"
        type: boolean
        default: false

concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # A first load on an empty database geocodes every address (no cache in CI); give it room.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/pipeline
    env:
      # Supabase *session* pooler URI (port 5432): runners have no IPv6 for the direct host.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      # Optional: without it the photo step logs "skipped" and the run stays ok.
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      GEOCODE_CACHE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev || uv sync --no-dev
      - name: Run
        run: |
          set -euo pipefail
          if [ "${{ inputs.command }}" = "backfill" ]; then
            uv run --no-sync python -m pipeline backfill
          elif [ "${{ inputs.command }}" = "photos" ]; then
            args=(--record-dir "$RUNNER_TEMP/mapillary")
            [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
            uv run --no-sync python -m pipeline photos "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            args=()
            [ "${{ inputs.full }}" = "true" ] && args+=(--full)
            [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
            uv run --no-sync python -m pipeline sync "${args[@]}"
          fi
      - name: Keep the raw Mapillary answers (test fixtures)
        if: inputs.command == 'photos'
        uses: actions/upload-artifact@v4
        with:
          name: mapillary-responses
          path: ${{ runner.temp }}/mapillary
          if-no-files-found: ignore
          retention-days: 7
      - name: Report
        if: always()
        run: uv run --no-sync python -m pipeline report | head -c 20000 >> "$GITHUB_STEP_SUMMARY" || true
