[project]
name = "pipeline"
version = "0.1.0"
description = "Daycare Watch data pipeline: Texas HHSC Child Care Regulation data into Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs a running local Postgres (DATABASE_URL)"]
