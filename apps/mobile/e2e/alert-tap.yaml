appId: com.areebhirani.daycare-watch
---
# journey.sh delivers the push after this flow starts; tap the banner while it's on screen.
- extendedWaitUntil:
    visible: "Viva World School"
    timeout: 30000
- takeScreenshot: ../../harness/state/screens/alert-0-push
- tapOn:
    text: "Replay of a real state record.*"
    index: 0
# iOS groups repeat alerts: the first tap only expands the stack, so tap the newest one again.
- runFlow:
    when:
      visible: "Show less"
    commands:
      - tapOn:
          text: "Replay of a real state record.*"
          index: 0
- extendedWaitUntil:
    visible: "Open full record"
    timeout: 20000
- takeScreenshot: ../../harness/state/screens/alert-1-detail
- scroll
- takeScreenshot: ../../harness/state/screens/alert-2-actions
