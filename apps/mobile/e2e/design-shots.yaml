appId: com.areebhirani.daycare-watch
# Screens for design review: find + pin callout, record, watching, rights, alert. Light mode.
---
- launchApp
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Name, city, or ZIP"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*\\. Last state visit .*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/light-find
- tapOn:
    point: "47%,34%"
- runFlow:
    when:
      visible: "Open the record"
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: e2e/out/light-find-callout
      - tapOn: "Close"
- openLink: daycarewatch://daycare/1459611
- extendedWaitUntil:
    visible: "Watch this daycare|Watching.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: e2e/out/light-record-1
- scroll
- takeScreenshot: e2e/out/light-record-2
- openLink: daycarewatch://watching
- extendedWaitUntil:
    visible: ".*\\. Latest: .*"
    timeout: 20000
- takeScreenshot: e2e/out/light-watching
- openLink: daycarewatch://rights
- extendedWaitUntil:
    visible: "Read the law"
    timeout: 10000
- takeScreenshot: e2e/out/light-rights
- scroll
- takeScreenshot: e2e/out/light-rights-2
