# QA U21-U23 (simulator part): a push tap calls router.push(`/alert/${event_id}?operationId=…`)
# (lib/notifications.ts openFromNotification). Expo Go on a simulator drops simctl pushes, so this opens that
# exact route for real event 43 (daycare 1304920) cold and warm; the banner tap itself is checked on a phone.
appId: host.exp.Exponent
---
- runFlow: _push-setup.yaml
# Warm: app running.
- openLink: ${METRO}/--/alert/43?operationId=1304920
- extendedWaitUntil:
    visible: ".*Replay of a real state record.*"
    timeout: 30000
- assertNotVisible: "This alert isn’t on this phone."
- takeScreenshot: ../../harness/state/qa/u22-warm-alert
# Cold: app quit first.
- stopApp
- openLink: ${METRO}/--/alert/43?operationId=1304920
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: ".*Replay of a real state record.*"
    timeout: 60000
- takeScreenshot: ../../harness/state/qa/u21-cold-alert
