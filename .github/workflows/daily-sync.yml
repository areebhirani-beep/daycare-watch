name: daily-sync

# The state reloads activities and violations nightly around 09:00 UTC; run after it settles.
# GitHub can start a scheduled run late or skip it, so a second run follows. A sync is idempotent
# (a re-run creates no events, pushes are deduped) and the concurrency group keeps them in order.
on:
  schedule:
    - cron: "15 10 * * *"
    - cron: "47 11 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "sync (daily), backfill (first load of a new database), photos (Mapillary street photos only), or replay (resend a real past visit's findings as a labelled replay)"
        type: choice
        options: [sync, backfill, photos, replay]
        default: sync
      operation_id:
        description: "replay only: the daycare's state operation ID; its newest visit with findings is resent to the parents who watch it"
        type: string
        default: ""
      full:
        description: "sync only: re-pull every operation, not only those past the watermark"
        type: boolean
        default: false
      dry_run:
        description: "sync, photos, and replay: do everything, then write nothing; no pushes"
        type: boolean
        default: false

concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # A first load on an empty database geocodes every address (no cache in CI); give it room.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/pipeline
    env:
      # Supabase *session* pooler URI (port 5432): runners have no IPv6 for the direct host.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      # Optional: without it the photo step logs "skipped" and the run stays ok.
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      GEOCODE_CACHE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev || uv sync --no-dev
      - name: Run
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.command }}" = "replay" ]; then
            [[ "$OPERATION_ID" =~ ^[0-9]+$ ]] || { echo "operation_id must be a state operation ID (digits only)"; exit 1; }
            args=(--replay-latest "$OPERATION_ID")
            [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
            uv run --no-sync python -m pipeline sync "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.command }}" = "backfill" ]; then
            uv run --no-sync python -m pipeline backfill
          elif [ "${{ inputs.command }}" = "photos" ]; then
            args=(--record-dir "$RUNNER_TEMP/mapillary")
            [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
            uv run --no-sync python -m pipeline photos "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            args=()
            [ "${{ inputs.full }}" = "true" ] && args+=(--full)
            [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
            uv run --no-sync python -m pipeline sync "${args[@]}"
          fi
      - name: Keep the raw Mapillary answers (test fixtures)
        if: inputs.command == 'photos'
        uses: actions/upload-artifact@v4
        with:
          name: mapillary-responses
          path: ${{ runner.temp }}/mapillary
          if-no-files-found: ignore
          retention-days: 7
      - name: Report
        if: always()
        run: uv run --no-sync python -m pipeline report | head -c 20000 >> "$GITHUB_STEP_SUMMARY" || true
